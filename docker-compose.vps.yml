# VPS voice test: the real agent (API + Postgres). The API uses host networking so aiortc's ICE
# candidates are the VPS's own addresses; it listens on 127.0.0.1 only (reach it over an SSH
# tunnel). Postgres is published on the host loopback only, never publicly. WebRTC media uses
# UDP 32768-60999 (opened in ufw for the owner's IP only, during the test).
#   docker compose -p dueflow --env-file .env.spike -f docker-compose.vps.yml up -d --build
services:
  postgres:
    image: postgres:16-alpine
    environment:  # from --env-file (interpolation only): no API keys inside this container
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: "no"

  api:
    build: .
    image: dueflow-api:vps
    env_file: .env.spike
    environment:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "55432"
    network_mode: host
    command: uvicorn app.main:app --host 127.0.0.1 --port 8000
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
