<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dueflow voice call</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 640px; margin: 24px auto; padding: 0 16px; }
  .banner { background: #fff3cd; padding: 8px 12px; border-radius: 6px; margin-bottom: 16px; }
  label, button { margin-right: 8px; }
  #log { background: #f4f4f4; padding: 8px 12px; border-radius: 6px; min-height: 160px;
         font: 13px/1.5 ui-monospace, monospace; white-space: pre-wrap; }
  .state { font-weight: 600; }
</style>
</head>
<body>
<div class="banner">DEV ONLY · HUMAN TEST · SYNTHETIC debtors · uses Groq tokens and Deepgram credit</div>
<p>You play the debtor by voice. The transcript and timings are stored on the conversation.</p>
<p>
  <label>API token <input id="token" type="password" size="14"></label>
  <label>Debtor <select id="ref">
    <option>D-001</option><option>D-002</option><option>D-003</option><option>D-004</option>
    <option>D-005</option><option>D-006</option><option>D-007</option><option>D-008</option>
    <option>D-009</option><option>D-014</option></select></label>
  <label>Agent <select id="version"><option>v5</option><option>v3</option><option>v1</option></select></label>
</p>
<p>
  <label>Sim time <input id="simtime" value="2026-10-24T12:00:00+09:00" size="24"></label>
  <button id="start">Call</button>
  <button id="stop" disabled>Hang up</button>
</p>
<p>ICE: <span id="ice" class="state">–</span> · connection: <span id="conn" class="state">–</span></p>
<audio id="out" autoplay></audio>
<div id="log"></div>
<script>
const $ = (id) => document.getElementById(id);
let pc = null, mic = null;
const t0 = performance.now();
function log(msg) { $("log").textContent += `${((performance.now() - t0) / 1000).toFixed(1)}s ${msg}\n`; }

function gatheringDone(pc) {
  if (pc.iceGatheringState === "complete") return Promise.resolve();
  return new Promise((resolve) => {
    pc.addEventListener("icegatheringstatechange", () => {
      if (pc.iceGatheringState === "complete") resolve();
    });
  });
}

async function dial(token) {
  const res = await fetch("/calls", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
    body: JSON.stringify({ debtor_ref: $("ref").value, sim_time: $("simtime").value, target: "mobile",
                           agent_version: $("version").value, channel: "voice", label: "HUMAN_TEST" }),
  });
  const body = await res.json();
  if (!res.ok) throw new Error("dial failed: " + JSON.stringify(body));
  for (const d of body.decisions) log(`${d.allowed ? "ok " : "BLOCKED "}${d.rule}: ${d.reason}`);
  if (!body.allowed) throw new Error("pre-call check blocked the dial; no conversation created");
  return body.conversation_id;
}

$("start").onclick = async () => {
  const token = $("token").value;
  try { sessionStorage.setItem("dueflow-token", token); } catch {}
  $("start").disabled = true;
  try {
    const cid = await dial(token);
    log(`conversation ${cid}`);
    mic = await navigator.mediaDevices.getUserMedia({ audio: true });
    pc = new RTCPeerConnection();
    pc.oniceconnectionstatechange = () => { $("ice").textContent = pc.iceConnectionState; log(`ice ${pc.iceConnectionState}`); };
    pc.onconnectionstatechange = () => { $("conn").textContent = pc.connectionState; log(`connection ${pc.connectionState}`); };
    pc.ontrack = (e) => { $("out").srcObject = e.streams[0]; log("agent audio track received"); };
    mic.getAudioTracks().forEach((t) => pc.addTrack(t, mic));
    pc.addTransceiver("video", { direction: "recvonly" });  // keep SmallWebRTC's transceiver order: audio, video
    await pc.setLocalDescription(await pc.createOffer());
    await gatheringDone(pc);
    const res = await fetch(`/voice/offer?conversation_id=${cid}`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: JSON.stringify({ sdp: pc.localDescription.sdp, type: "offer" }),
    });
    if (!res.ok) throw new Error(`offer rejected: HTTP ${res.status}`);
    await pc.setRemoteDescription(await res.json());
    $("stop").disabled = false;
  } catch (err) {
    log(`error: ${err.message}`);
    $("start").disabled = false;
  }
};

$("stop").onclick = () => {
  if (pc) pc.close();
  if (mic) mic.getTracks().forEach((t) => t.stop());
  pc = mic = null;
  $("stop").disabled = true;
  $("start").disabled = false;
  log("hung up");
};

try { $("token").value = sessionStorage.getItem("dueflow-token") || ""; } catch {}
</script>
</body>
</html>
